# Tiny Tapeout project information
project:
  title:        "Reconfigurable INT8 MLP NPU"
  author:       "P. Akhendra Kumar"
  discord:      ""
  description:  "Weight-streaming INT8 MLP inference accelerator, reconfigurable across tasks"
  language:     "Verilog"
  clock_hz:     10000000
  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"
  # Your top module name must start with "tt_um_". Made unique with github username:
  top_module:  "tt_um_akhendrakumar_npu"
  # List your project's source files here.
  source_files:
    - "project.v"
# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "data_in[0]"
  ui[1]: "data_in[1]"
  ui[2]: "data_in[2]"
  ui[3]: "data_in[3]"
  ui[4]: "data_in[4]"
  ui[5]: "data_in[5]"
  ui[6]: "data_in[6]"
  ui[7]: "data_in[7]"
  # Outputs
  uo[0]: "result[0]"
  uo[1]: "result[1]"
  uo[2]: "result[2]"
  uo[3]: "result[3]"
  uo[4]: "result[4]"
  uo[5]: "result[5]"
  uo[6]: "result[6]"
  uo[7]: "result[7]"
  # Bidirectional pins
  uio[0]: "spi_sclk"
  uio[1]: "spi_cs_n"
  uio[2]: "spi_mosi"
  uio[3]: "spi_miso"
  uio[4]: "start"
  uio[5]: "busy_done"
  uio[6]: "mode_sel"
  uio[7]: "strobe"
yaml_version: 6
